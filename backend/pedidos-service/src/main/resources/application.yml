server:
  port: 8082

spring:
  application:
    name: pedidos-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pedidos_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

cognito:
  issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# URL base de productos-service. En Docker Compose es el nombre del servicio; en AWS,
# la URL interna de la instancia EC2 (o, si se prefiere, otra ruta de API Gateway).
productos:
  service:
    url: ${PRODUCTOS_SERVICE_URL:http://localhost:8081}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
