server:
  port: 8081

spring:
  application:
    name: productos-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:productos_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# URL del "well-known" del User Pool de Cognito, SIN el sufijo /.well-known/openid-configuration
# Ejemplo: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX
cognito:
  issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Parcial 3: streaming de movimientos de stock con Amazon Kinesis Data Streams.
streaming:
  habilitado: ${STREAMING_HABILITADO:true}
  region: ${AWS_REGION:us-east-1}
  stream-inventario: ${STREAM_INVENTARIO:pedidos360-inventario-stream}
  umbral-stock-bajo: ${UMBRAL_STOCK_BAJO:5}
  envio:
    max-intentos: 3
    espera-inicial-ms: 100
    timeout-llamada-ms: 3000
